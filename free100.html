<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中島抽卡一百組</title>
<style>:root{--bg:#f3f0ea;--card:#fffdf9;--ink:#2f2721;--mute:#7b6d61;--line:#ddd4c7;--acc:#a8532a;--like:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#1c1916;--card:#26221e;--ink:#eee5d9;--mute:#b1a294;--line:#3b342e;--acc:#e0874f;--like:#ff6b5b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:14px 16px 56px;display:grid;gap:14px}h1{font-size:21px;margin:4px 0 0}a{color:var(--acc)}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}.box ul{margin:0;padding-left:20px}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 16px;font:inherit;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}button.on{outline:2px solid var(--acc)}
#stat{color:var(--mute);font-size:14px}
.w{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.c{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}.c.liked{border-color:var(--like);box-shadow:0 0 0 2px var(--like)}.c.nope{opacity:.35}
.c img{width:100%;display:block;aspect-ratio:3/2;object-fit:cover;cursor:zoom-in;background:var(--line)}
.c .b{display:flex;align-items:center;gap:8px;padding:6px 10px}.c .t{flex:1;font-size:14px}.c .t small{color:var(--mute);display:block;font-size:12px}
.c .b button{padding:3px 12px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}#lb img{max-width:96vw;max-height:94vh}
</style></head><body><main><h1>中島抽卡｜GPT 自由發想 100 組</h1>

<li>按「抽 6 張」會從還沒看過的裡面隨機抽，看到喜歡的按 ♥，不喜歡按 ✕；紀錄存在這台裝置的瀏覽器裡</li>
<li>挑完按「複製我喜歡的編號」貼給 Claude，就照那幾款去建白模</li>
<li><a href="./">回首頁</a></li></ul></div>
<nav><button class="pri" id="draw">🎲 抽 6 張</button><button id="likes">♥ 我喜歡的</button><button id="all">全部 100 張</button><button id="copy">複製我喜歡的編號</button><button id="reset">重來</button><span id="stat"></span></nav>
<div class="w" id="g"></div></main><div id="lb" onclick="this.style.display='none'"><img alt=""></div>

const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let V=ld('isl100v'),L=ld('isl100l'),cur=[];
const g=document.getElementById('g');
function card(d){const s=L[d.no];return `<div class="c ${s==1?'liked':s==-1?'nope':''}"><img loading="lazy" src="free100/${d.no}.jpg" alt="${d.nm}" onclick="z(this)"><div class="b"><div class="t">${d.no} ${d.nm}<small>${d.fn}</small></div><button onclick="mark('${d.no}',1)">♥</button><button onclick="mark('${d.no}',-1)">✕</button></div></div>`}
function show(list){cur=list;g.innerHTML=list.map(card).join('')||'<p>按「🎲 抽 6 張」開始</p>';stat()}
function stat(){const n=Object.keys(V).length,l=Object.values(L).filter(x=>x==1).length;document.getElementById('stat').textContent=`看過 ${n}/${D.length}・喜歡 ${l}`}
function mark(no,v){L[no]=L[no]==v?0:v;sv('isl100l',L);show(cur)}
document.getElementById('draw').onclick=()=>{let pool=D.filter(d=>!V[d.no]);if(!pool.length){alert('100 張都看過了，按「重來」可以重新抽');return}
 pool.sort(()=>Math.random()-.5);const p=pool.slice(0,6);p.forEach(d=>V[d.no]=1);sv('isl100v',V);show(p);scrollTo(0,0)};
document.getElementById('likes').onclick=()=>show(D.filter(d=>L[d.no]==1));
document.getElementById('all').onclick=()=>show(D);
document.getElementById('copy').onclick=()=>{const s=D.filter(d=>L[d.no]==1).map(d=>d.no+' '+d.nm).join('、')||'（還沒有喜歡的）';navigator.clipboard?.writeText(s).then(()=>alert('已複製：'+s),()=>prompt('複製這段：',s))};
document.getElementById('reset').onclick=()=>{if(confirm('清掉看過和喜歡的紀錄？')){V={};L={};sv('isl100v',V);sv('isl100l',L);show([])}};
function z(i){const l=document.getElementById('lb');l.querySelector('img').src=i.src;l.style.display='flex'}
show([]);stat();
</script></body></html>
